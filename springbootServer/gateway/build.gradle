plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'           // Spring Boot 버전
    id 'io.spring.dependency-management' version '1.1.7'     // 라이브러리 버전 자동 맞춤
}

group = 'com.shinhan'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)          // Java 21
    }
}

repositories {
    mavenCentral()                                            // 라이브러리 받는 곳
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'   // 웹 + RestClient + Jackson 전부
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}